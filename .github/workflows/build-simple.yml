name: Build WaifuX
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-14
    steps:
      - run: git clone --depth 1 https://github.com/sfyqiu/WaifuX-Mac-.git .
      - run: brew install xcodegen create-dmg || true
      - run: xcodegen generate
      - run: chmod +x ./scripts/package.sh && ./scripts/package.sh 2>&1
      - run: gh release create v1.0 build/WaifuX.dmg --repo sfyqiu/WaifuX-Mac- --title "WaifuX v1.0" --notes "用次编砑，开兜亮建目\" 2>&1 || echo "release skipped"