name: Build WaifuX
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: brew install xcodegen create-dmg || true
      - run: xcodegen generate
      - run: chmod +x ./scripts/package.sh && ./scripts/package.sh 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: WaifuX-build
          path: build/WaifuX.dmg
          retention-days: 7