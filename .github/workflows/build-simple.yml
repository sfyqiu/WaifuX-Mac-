name: Build WaifuX
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-14
    steps:
      - run: git clone --depth 1 https://github.com/sfyqiu/WaifuX-Mac-.git .
      - run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null || echo "default"
      - run: brew install xcodegen create-dmg || true
      - run: xcodegen generate
      - run: xcodebuild -scheme WaifuX -configuration Release -derivedDataPath build CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0 ONLY_ACTIVE_ARCH=NO build 2>&1 || true
      - run: |
          APP="build/Build/Products/Release/WaifuX.app"
          if [ -d "$APP" ]; then
            hdiutil create -volname "WaifuX" -srcfolder "$(dirname "$APP")" -ov -format UDZO build/WaifuX.dmg
          fi
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.0 build/WaifuX.dmg --repo ${{ github.repository }} --title "WaifuX v1.0" --notes "首次编译，开启成人分类" 2>&1 || true