name: Build WaifuX
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-14
    steps:
      - run: git clone --depth 1 https://github.com/sfyqiu/WaifuX-Mac-.git .
      - run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null || echo "default"
      - run: xcodebuild -version
      - run: brew install xcodegen create-dmg || true
      - run: xcodegen generate
      - run: mkdir -p build
      - run: xcodebuild -scheme WaifuX -configuration Release clean archive SWIFT_STRICT_CONCURRENCY=minimal CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO DEBUG_INFORMATION_FORMAT=dwarf MACOSX_DEPLOYMENT_TARGET=14.4 -archivePath build/WaifuX.xcarchive 2>&1 || true
      - run: gh release create v1.0 build/WaifuX.dmg --repo sfyqiu/WaifuX-Mac- --title "WaifuX v1.0" --notes "首次编译，开启成人分类" 2>&1 || true