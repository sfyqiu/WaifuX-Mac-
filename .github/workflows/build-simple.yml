name: Build WaifuX
on: workflow_dispatch
env:
  SWIFT_STRICT_CONCURRENCY: minimal
jobs:
  build:
    runs-on: macos-14
    steps:
      - run: git clone --depth 1 https://github.com/sfyqiu/WaifuX-Mac-.git .
      - run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null || echo "default"
      - run: xcodebuild -version
      - run: brew install xcodegen create-dmg || true
      - run: xcodegen generate
      - run: chmod +x ./scripts/package.sh
      - run: SWIFT_STRICT_CONCURRENCY=minimal ./scripts/package.sh 2>&1
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.0 build/WaifuX.dmg --repo ${{ github.repository }} --title "WaifuX v1.0" --notes "首次编译，开启成人分类" 2>&1