name: Build WaifuX
on: workflow_dispatch
permissions: write-all
jobs:
  build:
    runs-on: macos-14
    steps:
      - run: git clone --depth 1 https://github.com/sfyqiu/WaifuX-Mac-.git .
      - run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null || echo "default"
      - run: brew install xcodegen create-dmg || true
      - run: xcodegen generate
      - run: xcodebuild -scheme WaifuX -xcconfig strict.xcconfig -configuration Release -derivedDataPath build CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO build 2>&1
      - run: |
          APP="build/Build/Products/Release/WaifuX.app"
          if [ -d "$APP" ]; then
            hdiutil create -volname "WaifuX" -srcfolder "$(dirname "$APP")" -ov -format UDZO build/WaifuX.dmg
            gh release create v1.0 build/WaifuX.dmg --repo ${{ github.repository }} --title "WaifuX v1.0" --notes "首次编译，开启成人分类"
          else
            find build -name "*.app" -type d 2>/dev/null
          fi